<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBTI 人格傾向與日常行為調查</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0ebf8;font-family:Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;color:#202124;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:12px auto 40px;padding:0 8px}
.card{background:#fff;border:1px solid #dadce0;border-radius:8px;padding:24px;margin-bottom:12px;position:relative;transition:border-color .2s}
.head{border-top:10px solid #673ab7;padding-top:22px}
.head h1{font-size:30px;font-weight:400;margin:0 0 12px;line-height:1.3}
.head .desc{font-size:14px;line-height:1.7}
.head .meta{border-top:1px solid #dadce0;margin:16px -24px 0;padding:12px 24px 0;font-size:14px;color:#d93025}
.sec{padding:0;overflow:hidden}
.sec .tab{background:#673ab7;color:#fff;padding:8px 16px;font-size:13px;display:inline-block;border-radius:0 0 8px 0}
.sec .st{padding:14px 24px 6px;font-size:20px}
.sec .sd{padding:0 24px 18px;font-size:14px;line-height:1.6;color:#5f6368}
.sec .st:last-child{padding-bottom:18px}
.qt{font-size:16px;line-height:1.5;margin-bottom:16px}
.qd{font-size:13px;color:#5f6368;margin:-8px 0 16px;line-height:1.6}
.req{color:#d93025}
.ti{border:none;border-bottom:1px solid #dadce0;width:50%;min-width:220px;font-size:14px;padding:6px 0;outline:none;font-family:inherit;background:transparent}
.ti:focus{border-bottom:2px solid #673ab7}
.opt{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1);width:fit-content;position:relative;z-index:2}
.opt input{width:20px;height:20px;accent-color:#673ab7;margin:0;cursor:pointer;flex:none}
.opt.hid{display:none}
.opt.pop{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);background:#fff59d}60%{background:#fff59d}100%{transform:scale(1);background:transparent}}
.err,.wmsg{color:#d93025;font-size:12px;margin-top:12px;line-height:1.6}
.err{display:none}
.q.bad,.q.warn{border-color:#d93025}.q.bad .err{display:block}
.scale{display:flex;align-items:flex-end;justify-content:space-between;gap:2px;font-size:14px}
.scale .lb{padding-bottom:4px;max-width:96px;text-align:center;font-size:13px;line-height:1.4}
.scale label{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;flex:1}
.scale input{width:20px;height:20px;accent-color:#673ab7;margin:0}
.thumb{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#1a1a2e,#3a2d6b 60%,#673ab7);display:flex;align-items:center;justify-content:center;color:#fff}
.thumb .play{width:68px;height:48px;background:#f00;border-radius:12px;display:flex;align-items:center;justify-content:center}
.thumb .play:after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.thumb .cap{position:absolute;left:14px;top:12px;font-size:14px;opacity:.9}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.75);font-size:12px;padding:2px 6px;border-radius:3px}
.ctab{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.btn{background:#673ab7;color:#fff;border:none;border-radius:4px;padding:9px 24px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:transform .2s cubic-bezier(.3,1.6,.5,1);position:relative;z-index:5;text-decoration:none;display:inline-block}
.btn:hover{background:#5e35b1}
.btn.w{background:#fff;color:#673ab7;border:1px solid #dadce0}
.btn.w:hover{background:#f6f2fc}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:#5f6368;margin-left:auto}
.pb{width:120px;height:10px;background:#e0e0e0;border-radius:5px;overflow:hidden;display:inline-block}
.pb i{display:block;height:100%;background:#673ab7;transition:width .4s}
.pb.big{width:100%;height:12px;margin-top:6px}
.clear{color:#673ab7;font-size:14px;cursor:pointer;margin-left:8px}
.foot{text-align:center;font-size:12px;color:#5f6368;margin-top:24px;line-height:1.8}
.link{color:#1a73e8;font-size:14px;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(10px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
body.glitch .wrap{animation:glitch .7s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0);filter:none}25%{transform:translate(-8px,4px) skewX(8deg);filter:hue-rotate(90deg) invert(1)}50%{transform:translate(8px,-4px);filter:saturate(8)}75%{transform:translate(-4px,0) skewX(-10deg);filter:invert(1)}100%{transform:translate(0)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:#323232;color:#fff;padding:14px 22px;border-radius:6px;font-size:14px;transition:transform .3s;z-index:3000;max-width:90vw;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#toast.show{transform:translate(-50%,0)}
#testp{position:fixed;right:10px;bottom:10px;z-index:4000;background:#fff;border:2px dashed #673ab7;border-radius:8px;padding:10px;width:200px;box-shadow:0 3px 10px rgba(0,0,0,.2);font-size:13px}
#testp b{display:block;cursor:pointer;color:#673ab7;margin-bottom:6px}
#testp button{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 8px;border:1px solid #dadce0;border-radius:4px;background:#f8f9fa;font:inherit;cursor:pointer}
#testp small{display:block;color:#5f6368;margin-top:6px;line-height:1.5}
#testp.min div{display:none}#testp.min b{margin:0}
.yarm{position:absolute;overflow:hidden;opacity:0;z-index:6}
.yarm iframe{position:absolute;border:0}
.vbox.vhide{position:absolute;left:0;right:0;top:0;margin:0;opacity:0;pointer-events:none;animation:none}
.vbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;margin-top:12px;animation:pop .5s}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tr{background:#f8f9fa;border-left:3px solid #673ab7;border-radius:4px;padding:12px 14px;font-size:14px;line-height:1.9;margin-bottom:16px;min-height:48px}
.tr div{animation:pop .3s}
#flash{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(0);font:900 110px/1 Arial,sans-serif;color:#673ab7;text-shadow:5px 5px 0 #fff59d;z-index:1500;pointer-events:none;white-space:nowrap}
#flash.on{animation:fl 1.1s ease-out}
@keyframes fl{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
#frog{position:fixed;z-index:1200;object-fit:contain;cursor:pointer;transition:transform .55s cubic-bezier(.3,1.3,.5,1);display:none;-webkit-user-drag:none;user-select:none}
.frogwin{text-align:center;margin:10px 0 4px}
.frogwin img{width:150px;cursor:pointer;animation:boing 1s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{transform:scale(0) rotate(-15deg)}100%{transform:scale(1)}}
.frogwin img.angry{animation:angry .15s linear 6;filter:saturate(1.6) hue-rotate(-20deg)}
@keyframes angry{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.frogwin img.flee{animation:flee 1s cubic-bezier(.5,-.5,.8,.3) forwards}
@keyframes flee{0%{transform:none}25%{transform:translateY(14px) scaleY(.8)}100%{transform:translate(30px,-110vh) rotate(540deg) scale(.4);opacity:0}}
.score{border-top:1px solid #dadce0;margin:18px -24px 0;padding:22px 24px 4px;text-align:center}
.score .sl{font-size:13px;color:#5f6368;margin-bottom:12px}
.slots{white-space:nowrap}
.slots span{display:inline-block;width:56px;height:70px;border:2px solid #673ab7;color:#673ab7;font:700 40px/66px Roboto,Arial,sans-serif;text-align:center;border-radius:8px;margin:0 3px;background:#fff}
.slots.flip span{animation:flip .5s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.slots.final span{background:#673ab7;color:#fff}
.sn{font-size:15px;margin:14px 0 6px;min-height:22px;color:#3c4043}
.sn b{font-size:20px;color:#202124;display:block;margin-bottom:4px}
#rbody{display:none;opacity:0;transform:translateY(16px);transition:all .6s}
#rbody.on{opacity:1;transform:none}
.rt{font-size:16px;font-weight:500;margin-bottom:6px}
.rs{font-size:12px;color:#5f6368;margin-bottom:16px}
.rp{font-size:14px;line-height:1.85;margin:0 0 10px}
.fn{display:flex;gap:14px;padding:14px 0;border-top:1px solid #f1f3f4}
.fn:first-of-type{border-top:none;padding-top:4px}
.fn .lt{flex:none;width:44px;height:44px;border-radius:50%;background:#ede7f6;color:#673ab7;font:700 22px/44px Roboto,Arial,sans-serif;text-align:center}
.fn .ft{font-size:12px;color:#5f6368}
.fn .fw{font-size:15px;font-weight:500;margin:2px 0 4px}
.fn .fd{font-size:13px;color:#3c4043;line-height:1.7}
.mini{height:6px;background:#ede7f6;border-radius:3px;margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:#673ab7;width:0;transition:width 1s .3s}
.ob{padding:12px 14px;background:#f8f9fa;border-radius:6px;margin-bottom:10px}
.ob small{display:block;font-size:11px;color:#673ab7;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.ob p{margin:0;font-size:14px;line-height:1.8}
.rel{display:flex;padding:10px 0;border-top:1px solid #f1f3f4;font-size:14px;gap:12px}
.rel:first-of-type{border-top:none}
.rel span{width:72px;flex:none;color:#5f6368}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;margin:10px 0}
.bar b{width:48px;font-weight:500}
.bar .t{flex:1;height:22px;background:#f1f3f4;border-radius:0 4px 4px 0;overflow:hidden}
.bar .t i{display:block;height:100%;background:#673ab7;width:0;transition:width 1s .3s}
.bar span{width:40px;text-align:right;color:#5f6368}
.cta{border-top:10px solid #673ab7;text-align:center}
.cta .rt{font-size:18px}
.cta .ctab{justify-content:center;margin:16px 0 0}
.foot .pw{text-align:left}
.foot a{color:inherit}
.foot .gmark{display:block;width:fit-content;margin:18px auto 0;font:400 24px/1 "Product Sans",Roboto,Arial,sans-serif;color:#5f6368;text-decoration:none;letter-spacing:-.3px}
.head .gl{border-top:1px solid #dadce0;margin:16px -24px 0;padding:14px 24px;font-size:14px;color:#202124}
.head .gl a{color:#1a73e8}
.head .gl+.meta{margin-top:0}
/* 手機版：比照 Google 表單手機排版（卡片寬 90%、內距 24px、16px 字、進度條在按鈕上方獨立一列） */
@media(max-width:520px){
  .wrap{width:90%;max-width:none;padding:0;margin:12px auto 32px}
  .head h1{font-size:30px;line-height:1.25;margin-bottom:16px}
  .head .desc{font-size:16px;line-height:1.45}
  .head .meta{padding:16px 24px 0}
  .qt{font-size:16px;margin-bottom:22px}
  .qd{font-size:14px}
  .opt{font-size:16px;padding:10px 0;gap:16px}
  .ti{width:100%;min-width:0;font-size:16px;padding:8px 0}
  .scale .lb{font-size:11px;max-width:56px}
  .nav{margin:16px 0 8px;gap:12px}
  .nav .btn{padding:12px 24px;font-size:15px}
  .prog{order:-1;width:100%;justify-content:center;margin:0 0 8px;font-size:15px;color:#202124;gap:16px}
  .pb{flex:0 1 180px;height:10px}
  .clear{margin-left:auto;font-size:15px}
  .foot{font-size:13px;margin-top:20px}
  .slots span{width:50px;height:62px;font-size:34px;line-height:58px}
}
</style>
</head>

const BUF={};
function loadBuf(k){
  if(BUF[k])return BUF[k];
  if(fileBad[k]||!SOUND_FILES[k]||location.protocol==='file:'){fileBad[k]=true;return BUF[k]=Promise.resolve(null)}
  return BUF[k]=fetch(SOUND_FILES[k]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
    .then(b=>new Promise((res,rej)=>A().decodeAudioData(b,res,rej)))
    .catch(()=>{fileBad[k]=true;return null});
}
function play(k,ch){
  const free=!!FREE[k];
  if(k!=='tick'&&!free)stopAll();
  const syn=()=>{if(!SYN[k])return;freeNow=free;try{SYN[k]()}finally{freeNow=false}};
  if(!SOUND_FILES[k]||fileBad[k])return syn();
  const h={dead:false,src:null,stop(){h.dead=true;if(h.src)try{h.src.stop()}catch(e){}}};
  if(!free)live.add(h);if(ch&&!free)(chan[ch]=chan[ch]||[]).push(h);
  loadBuf(k).then(buf=>{
    if(h.dead)return;if(!buf){live.delete(h);return syn()}
    const a=A(),s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.value=.9;
    s.connect(g).connect(free?a.destination:out());s.onended=()=>live.delete(h);s.start();h.src=s;
  });

// 手機（尤其 IG / Threads 內建瀏覽器）只允許「手指直接點在 YouTube 播放器上」才有聲播放，
// 從外面呼叫 playVideo() 會被擋成靜音。所以做法是：影片先在背景載好，
// 再用幾乎透明的方式疊在「其他」選項 / 影片封面上（ytArm），使用者以為點的是選項，其實點到 YouTube 播放器，
// 偵測到開始播放（onStateChange）後再把播放器現形（ytReveal）。
let ytReady=false;const ytQ=[];const YTP={},YTW={},YTS={},YTCB={},YTA={},YTID={};
function loadYT(){
  if(window.YT&&YT.Player){ytReady=true;return}if(loadYT.started)return;loadYT.started=true;
  window.onYouTubeIframeAPIReady=()=>{ytReady=true;ytQ.splice(0).forEach(f=>f())};
  const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);
}
function ytPreload(key,id,place,onPlay){
  YTCB[key]=onPlay;
  if(location.protocol==='file:'||document.getElementById(key+'Wrap'))return;
  place(`<div class="vbox vhide" id="${key}Wrap"><div id="${key}Player"></div></div>`);
  YTP[key]=null;YTW[key]=false;YTS[key]=false;YTID[key]=id;loadYT();
  const go=()=>{if(!document.getElementById(key+'Player'))return;
    new YT.Player(key+'Player',{videoId:id,playerVars:{playsinline:1,rel:0,origin:location.origin},
      // YouTube 會把「靜音」狀態記在手機裡（之前的靜音備案呼叫過 mute() 就會一直被記住），所以載好時先強制解除靜音
      events:{onReady:e=>{YTP[key]=e.target;try{e.target.unMute();e.target.setVolume(100)}catch(x){}
          if(YTW[key])ytStart(key);else ytPlace(key)},
        onStateChange:e=>{
          if(e.data===1){try{if(e.target.isMuted()){e.target.unMute();e.target.setVolume(100)}}catch(x){}}
          if((e.data===1||e.data===3)&&!YTS[key]){YTS[key]=true;YTCB[key]&&YTCB[key]()}}}})};
  ytReady?go():ytQ.push(go);
}
// 把隱形播放器疊到 target 上。mode 'cover'：播放器放大 1.6 倍蓋住封面（把 YouTube 標題列、logo 等會跳轉的地方裁掉）；
// mode 'small'：480x270 的播放器中心對準小小的選項列。
function ytArm(key,card,getTarget,mode){
  const old=YTA[key];if(old&&old.ro)old.ro.disconnect();
  const a=YTA[key]={card,getTarget,mode};
  if(window.ResizeObserver){a.ro=new ResizeObserver(()=>ytPlace(key));a.ro.observe(card)}
  ytPlace(key);
}
function ytPlace(key){
  const a=YTA[key],w=document.getElementById(key+'Wrap');if(!a||!w||YTS[key])return;
  const t=a.getTarget(),f=w.querySelector('iframe');
  if(!t||!f||!YTP[key]||!document.body.contains(t)){w.className='vbox vhide';w.removeAttribute('style');return}
  const c=a.card,cr=c.getBoundingClientRect(),r=t.getBoundingClientRect();
  w.className='yarm';
  Object.assign(w.style,{left:r.left-cr.left-c.clientLeft+'px',top:r.top-cr.top-c.clientTop+'px',width:r.width+'px',height:r.height+'px'});
  const fw=a.mode==='cover'?r.width*1.6:480,fh=a.mode==='cover'?r.height*1.6:270;
  Object.assign(f.style,{width:fw+'px',height:fh+'px',left:(r.width-fw)/2+'px',top:(r.height-fh)/2+'px'});
}
addEventListener('resize',()=>Object.keys(YTA).forEach(ytPlace));
function ytReveal(key){
  const w=document.getElementById(key+'Wrap');const a=YTA[key];if(a&&a.ro)a.ro.disconnect();delete YTA[key];

  const n=w.nextElementSibling;if(!(n&&n.classList.contains('vfb')))w.insertAdjacentHTML('afterend',vfb(`https://www.youtube.com/watch?v=${YTID[key]}`));

function ytStart(key){
  const p=YTP[key];YTW[key]=false;

  // 瀏覽器擋住播放的話不改成靜音（mute 會被 YouTube 記住、害之後都沒聲音），改提示使用者自己點影片

// 備用路線：播放器還沒載好、點擊落在底下的選項/封面時才會走這裡（可能被擋成靜音）
function ytShow(key,id,fallback){

const FROG={shown:0,caught:0,seen:{},off:false,t:[]};
function frogPeek(){
  FROG.t.forEach(clearTimeout);FROG.t=[];frogHide();
  if(page<2||FROG.seen[page]||FROG.off)return;const my=page;
  FROG.t.push(setTimeout(()=>{if(page!==my||FROG.off||FROG.seen[page])return;
    FROG.seen[page]=true;
    const edges=['bottom','top','left','right'].filter(e=>e!==FROG.last),edge=edges[Math.random()*edges.length|0];FROG.last=edge;
    const w=Math.max(34,Math.round(120*Math.pow(.78,FROG.shown))),h=w*2;
    const vw=innerWidth,vh=innerHeight;let pos,rot,flip;
    if(edge==='bottom'||edge==='top'){const x=12+Math.random()*(vw-w-24);pos=`${edge}:0;left:${x}px`;rot=edge==='top'?180:0;flip=edge==='bottom'?x<vw/2:x>vw/2}
    else{const y=60+Math.random()*Math.max(0,vh-h-120);pos=`${edge}:${w/2}px;top:${y}px`;rot=edge==='left'?90:-90;flip=Math.random()<.5}
    const base=`rotate(${rot}deg) ${flip?'scaleX(-1) ':''}`;
    const f=$('#frog');f.src=FROG_IMG.peek;
    f.style.cssText=`display:block;width:${w}px;height:${h}px;${pos};transition:none;transform:${base}translateY(110%)`;
    f.dataset.base=base;FROG.shown++;FROG.live=true;void f.offsetWidth;
    f.style.transition='';f.style.transform=`${base}translateY(58%)`;
    FROG.t.push(setTimeout(frogHide,3200));
  },700+Math.random()*1500));
}
function frogHide(){const f=$('#frog');if(!FROG.live)return;FROG.live=false;f.style.transform=`${f.dataset.base}translateY(110%)`}
$('#frog').addEventListener('pointerdown',e=>{e.preventDefault();if(!FROG.live)return;FROG.live=false;FROG.caught++;play('frog');

function optHTML(q,o,k,extra=''){
  const ty=q.type==='checkbox'?'checkbox':'radio',v=ans[q.id];
  const on=ty==='radio'?v===k:(v||[]).includes(k);
  const hid=(q.late===k&&!q.lateShown)?' hid':'';
  return `<label class="opt${hid}${extra}" data-k="${k}"><input type="${ty}" name="${q.id}" value="${k}"${on?' checked':''}><span>${o}</span></label>`;
}

}
const seqTxt=h=>h.slice(-8).map(s=>`「${esc(s)}」`).join(' → ');
// 追蹤「有沒有點進我們的連結」以及「點出去之後在外面待了幾秒」（回到這頁時用 visibilitychange 計算）。
// 注意：網頁看不到對方在 IG / YouTube 上有沒有真的按追蹤，只能看離開多久來推測。
stats.went={};stats.away={};stats.goOut=null;
function noteGo(k){stats.went[k]=true;stats.goOut={k,t:Date.now()};save()}
// 回到這頁：算出在外面待了幾秒（頁面被重新載入的情況，在還原紀錄時也會呼叫）
function backFromOut(){
  const g=stats.goOut;if(!g)return null;stats.goOut=null;
  const s=Math.round((Date.now()-g.t)/1000);stats.away[g.k]=Math.max(stats.away[g.k]||0,s);save();return [g.k,s];
}
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;
  const h=a.getAttribute('href');const k=h===CONFIG.igUrl?'ig':h===CONFIG.ytChannelUrl?'yt':h===CONFIG.videoUrl?'video':null;
  if(k)noteGo(k)},true);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return save();
  const r=backFromOut();if(r&&$('#cta'))ctaBack(...r);
});
const awayTxt=s=>s<1?'不到 1 秒':`${s} 秒`;
// 結果頁上點出去又回來時，即時吐槽
function ctaBack(k,s){
  const t=$('#ctaT'),b=$('#ctaB');if(!t||!b)return;
  const where={ig:'IG',yt:'YouTube',video:'影片'}[k];
  if(s<4){t.textContent='……回來得好快喔';
    b.innerHTML=`<p class="rp" style="margin:6px 0 0">你在 ${where} 只待了 ${awayTxt(s)}。研究小組實測，這個時間${k==='video'?'連片頭都看不完':'不太夠按追蹤'}。</p>`;play('bruh')}
  else{t.textContent='🥹 謝謝你，你是好人';
    b.innerHTML=`<p class="rp" style="margin:6px 0 0">你在 ${where} 待了 ${awayTxt(s)}，研究小組選擇相信你有${k==='video'?'看完':'按下去'}。</p>`}
}
// 結果頁的情勒追蹤卡：依第六部分「支持我們」那題的回答 + 有沒有真的點過按鈕，給不同的台詞
function ctaCard(nick){
  const c=ans.ig||[],saidIg=c.includes(0),saidVid=c.includes(1),later=c.includes(2),went=stats.went,aw=stats.away;
  let lines;
  if(saidIg&&!went.ig)lines=[`${nick}，你在前面勾了「我已追蹤 IG」。`,'但系統顯示，你從頭到尾都沒有點過我們的 IG 連結。','沒關係，我們不會說什麼。我們只是會有點難過。'];
  else if(went.ig&&aw.ig!==undefined&&aw.ig<4)lines=[`${nick}，你剛剛點進我們的 IG，只待了 ${awayTxt(aw.ig)} 就回來了。`,'研究小組實測，這個時間不太夠按追蹤。','可以再去一次，我們等你。'];
  else if(later&&!saidIg)lines=['你前面說「下次一定」。','研究小組想通知你：現在就是下次。'];
  else if(went.ig)lines=[`謝謝你點進我們的 IG，${nick}${aw.ig?`，還待了 ${awayTxt(aw.ig)}`:''}。`,'如果你沒有按追蹤就跑回來了……','我們看不到，但你自己知道。'];
  else lines=['這份表單我們熬了好幾個晚上做出來，你只花了五分鐘填完。','追蹤只需要一秒。','我們算過了，這很划算。'];
  if(saidVid&&!went.video)lines.push('另外，你也說你看完新影片了，但你沒點過影片連結。我們也很想相信你。');
  else if(saidVid&&aw.video!==undefined&&aw.video<20)lines.push(`另外，你說你看完新影片了。你在影片那邊待了 ${awayTxt(aw.video)}。我們的影片沒有那麼短。`);
  return `<div class="card cta" id="cta"><div class="rt" id="ctaT">在你離開之前……</div>
    <div id="ctaB">${lines.map(l=>`<p class="rp" style="margin:6px 0 0">${l}</p>`).join('')}</div>
    <div class="ctab" id="ctaBtns"><a class="btn" data-r="ig" href="${CONFIG.igUrl}" target="_blank" rel="noopener">追蹤 IG ${esc(CONFIG.igHandle)}</a><a class="btn" data-r="yt" href="${CONFIG.ytChannelUrl}" target="_blank" rel="noopener">訂閱 YouTube</a><a class="btn w" data-r="video" href="${CONFIG.videoUrl}" target="_blank" rel="noopener">看最新影片</a></div>
    <p class="rp" style="margin:14px 0 0;font-size:13px;color:#5f6368">如果你早就追蹤了，<button class="link" id="ctaOld" style="font-size:13px">請點這裡領取你的神聖讚美</button></p>
    <div style="margin-top:10px"><button class="link" id="ctaNo" style="color:#9aa0a6;font-size:12px">殘忍拒絕</button></div></div>`;
}
function bindCta(nick){
  const t=$('#ctaT'),b=$('#ctaB'),no=$('#ctaNo');let refused=0;
  $('#ctaBtns').addEventListener('click',e=>{const a=e.target.closest('[data-r]');if(!a)return;
    play('ding');
    t.textContent='🥹 謝謝你，你是好人';
    b.innerHTML=`<p class="rp" style="margin:6px 0 0">${refused?'我們就知道你剛剛只是嘴硬。':'研究小組已將您的人格類型額外標註為「善良」。'}</p>`;
    no.style.display='none'});
  const old=$('#ctaOld');
  old.onclick=()=>{play('congcong');setTimeout(()=>play('airhorn'),350);
    t.textContent='✨ 神聖讚美已降臨 ✨';
    b.innerHTML=[`${nick}，你早就追蹤了。`,'研究小組全體起立，向你致上最崇高的敬意。','你是本研究的天選之人、節目的守護神、演算法的光。','從今天起，你的 MBTI 後面可以多加一個字母：S（Supporter）。'].map(l=>`<p class="rp" style="margin:6px 0 0">${l}</p>`).join('');
    old.parentElement.style.display='none';no.style.display='none'};
  const msgs=['你確定嗎？做這份表單的人現在眼睛還是紅的。',`研究小組已把「${nick}」寫進小本本。`,'好吧。我們會假裝沒事。','（研究小組正在哭）'];
  no.onclick=()=>{play('sadviolin');shake($('#cta'));
    b.innerHTML=`<p class="rp" style="margin:6px 0 0">${msgs[Math.min(refused,msgs.length-1)]}</p>`;
    refused++;if(refused===1)t.textContent='……';
    if(refused>=msgs.length){no.textContent='好啦我追';no.onclick=()=>{$('#ctaBtns [data-r="ig"]').click()}}
    else no.textContent=['真的不要','真的真的不要','不要'][refused-1]||'不要'};
}
function trackCard(){
  const all=Object.entries(HIST),total=all.reduce((s,[,h])=>s+h.length,0);if(!total)return '';
  const changed=all.filter(([id,h])=>h.length>1),top=changed.filter(([id])=>id!=='vid').sort((a,b)=>b[1].length-a[1].length).slice(0,3);
  const qt=id=>{const s=Q[id].q.replace(/<[^>]+>/g,'');return esc(s.length>28?s.slice(0,28)+'…':s)};
  const c=changed.length;
  const verdict=!c?'您每一題都只點一次就決定了。研究小組懷疑您根本沒有在看題目。'
    :c<=3?'偶爾會改答案，屬於正常人類的猶豫範圍。'
    :c<=7?'您的答案經常在最後一刻改變心意，研究小組建議您點餐時讓別人先點。'
    :'您幾乎每一題都改過答案。研究小組不確定最後提交的，到底是不是您真正的想法（您可能也不確定）。';
  return `<div class="card"><div class="rt">作答軌跡紀錄</div><div class="rs">系統於背景記錄之實際點擊行為（您以為我們沒在看）</div>
    <div class="rel"><span>點擊總數</span><div>${total} 次</div></div>
    <div class="rel"><span>改過答案</span><div>${c} 題</div></div>
    ${top.map(([id,h])=>`<div class="ob" style="margin-top:10px"><small>點了 ${h.length} 次</small><p><b>${qt(id)}</b><br>${h.length>8?'最後幾次：':''}${seqTxt(h)}</p></div>`).join('')}
    <p class="rp" style="margin-top:12px">${verdict}</p></div>`;
}
function t4Obs(){
  if(ans.t4!==0&&ans.t4!==1)return [];
  const d=stats.dodge,
    seen=['被要求評估出題者是天才還是曠世奇才','在洗澡時跟不存在的人吵架並吵贏','被問到雲長得像什麼','被問「竟然」還是「居然」'].join('、');
  let s=ans.t4===0
    ?`在作答「您是否覺得這份問卷越來越奇怪？」一題時，受試者已經歷過${seen}等題目，卻仍回答「沒有」。研究小組在此誠摯詢問：你還好嗎？`
    :`在「您是否覺得這份問卷越來越奇怪？」一題中，受試者不僅回答沒有，還特別選擇了「完全沒有」。研究小組根據多年經驗指出：會特別強調「完全」的人，心裡通常都有。`;
  if(d)s+=`更值得注意的是，系統紀錄顯示受試者曾試圖點擊「有」共 ${d} 次，最後卻選擇了「${ans.t4===0?'沒有':'完全沒有'}」。研究小組判斷其內心其實覺得非常奇怪，只是嘴硬。`;
  return [s];
}
function vidObs(){
  const h=HIST.vid||[];if(!h.length)return [];
  const last=h[h.length-1],n=h.length;
  if(n===1)return [`受試者於「研究說明影片」感想題中僅點擊 1 次，即果斷選擇「${esc(last)}」。研究小組認為其對一名男子端著一大鍋食物走路的影片，抱持著異常明確的立場。`];
  const seq=seqTxt(h);
  return [`受試者於「研究說明影片」感想題中共點擊 ${n} 次，${n>8?'最後幾次':'依序'}為：${seq}，最終選定「${esc(last)}」。研究小組認為，對一段影片的感想不應該如此難以決定。`];
}
function frogWin(fw){
  let n=0,au=null,gone=false;
  const card=fw.closest('.card'),laugh=()=>{if(au)au.stop();au=play('frog')||null};
  setTimeout(()=>{if(!gone)laugh()},1400);
  fw.onclick=()=>{if(gone)return;n++;laugh();
    if(n===5)warn(card,'fw','奶蛙笑太多，有點喘不過氣了。');
    if(n<8)return;
    gone=true;warn(card,'fw','奶蛙被你戳到笑不出來，已經逃走了。');
    fw.style.height=fw.offsetHeight+'px';fw.style.objectFit='contain';fw.src=FROG_IMG.peek;
    fw.classList.add('angry');
    setTimeout(()=>{fw.classList.remove('angry');fw.classList.add('flee');play('boing')},900);
    setTimeout(()=>{fw.style.visibility='hidden'},1900);
    const p=card.querySelector('.frogwin + .rp');if(p)p.textContent='全數捕獲。但您戳太多下了，奶蛙決定以後要繼續偷看您。';
  };
}
function spin(target,done,gap){
  const sp=[...document.querySelectorAll('#slots span')],L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let stop=0;
  const iv=setInterval(()=>{sp.forEach((s,i)=>{if(i>=stop)s.textContent=L[Math.random()*26|0]});play('tick')},70);
  const st=()=>{sp[stop].textContent=target[stop];stop++;play('ding');if(stop<4)setTimeout(st,gap);else{clearInterval(iv);done()}};
  setTimeout(st,900);
}

// ===== 作答紀錄保存：存在使用者自己的手機（localStorage），按返回、重新整理、從 IG 跳回來都能接著填；按「再填一次」才清掉 =====
const SAVE_KEY='mbti_form_save_v1',TEST=/[?&]test\b/.test(location.search);
let cleared=false;
function save(){
  if(TEST||cleared)return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({page,ans,stats,marks,HIST,GAGC,extras,
    frog:{shown:FROG.shown,caught:FROG.caught,seen:FROG.seen},
    qs:Object.fromEntries(Object.values(Q).map(q=>[q.id,{opts:q.opts,lateShown:q.lateShown}]))}))}catch(e){}
}
function clearSave(){cleared=true;try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function restore(){
  if(TEST)return false;
  let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
  if(!s||!s.ans)return false;
  try{
    Object.assign(ans,s.ans);Object.assign(stats,s.stats);Object.assign(marks,s.marks);Object.assign(HIST,s.HIST);
    GAGC.push(...(s.GAGC||[]));extras.splice(0,extras.length,...(s.extras||[]));
    Object.assign(FROG,s.frog||{});
    Object.entries(s.qs||{}).forEach(([id,v])=>{const q=Q[id];if(!q)return;if(v.opts)q.opts=v.opts;if(v.lateShown)q.lateShown=true});
    page=Math.min(Math.max(0,s.page|0),N-1);
    return true;
  }catch(e){return false}
}
['change','input','click'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(save,0)));
addEventListener('pagehide',save);setInterval(save,3000);

// ===== 結尾情勒話術測試面板：網址後面加 ?test 才會出現（例如 https://你的網址/?test），測試時不會存紀錄 =====
function testPanel(){
  const S=[['預設（什麼都沒做）',{}],['勾「已追蹤」但沒點連結',{ig:[0]}],['點進 IG 只待 2 秒',{ig:[0],went:{ig:1},away:{ig:2}}],
    ['點進 IG 待 30 秒',{ig:[0],went:{ig:1},away:{ig:30}}],['選「下次一定」',{ig:[2]}],
    ['說看完影片但沒點連結',{ig:[0,1],went:{ig:1},away:{ig:30}}],['說看完影片只待 8 秒',{ig:[1],went:{video:1},away:{video:8}}]];
  const d=document.createElement('div');d.id='testp';
  d.innerHTML=`<b>情勒話術測試 ▾</b><div>${S.map((x,i)=>`<button data-i="${i}">${x[0]}</button>`).join('')}<small>到結果頁後點 IG / YouTube 按鈕出去再回來，可以測「回來得好快喔」那段。</small></div>`;
  document.body.appendChild(d);
  d.onclick=e=>{
    if(e.target.tagName==='B'){d.classList.toggle('min');return}
    const b=e.target.closest('button');if(!b)return;const c=S[b.dataset.i][1];
    if(c.ig)ans.ig=c.ig;else delete ans.ig;
    stats.went={...(c.went||{})};stats.away={...(c.away||{})};stats.goOut=null;
    if(!ans.nick)ans.nick='測試人';
    reveal(true);setTimeout(()=>{const x=$('#cta');if(x)x.scrollIntoView({behavior:'smooth',block:'center'})},100);
  };
}

if(restore()){
  const back=backFromOut();
  if(stats.done){reveal(true);if(back)setTimeout(()=>ctaBack(...back),50)}
  else{render();toast('已幫你接回上次填到的地方')}
}else render();
if(TEST)testPanel();
</script>
